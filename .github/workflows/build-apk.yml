name: Build APK (Lari Koin)

# Build APK TWA gratis di GitHub (tanpa Play Store).
# Dijalankan manual dari tab Actions, atau otomatis saat file di twa/ berubah.
# Hasil: APK + AAB + keystore + password keystore (sebagai artifact, hanya
# pemilik repo yang bisa mengunduhnya). SIMPAN keystore + password baik-baik:
# update APK berikutnya HARUS ditandatangani dengan keystore yang sama.

on:
  workflow_dispatch:
  push:
    paths:
      - 'twa/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Runner GitHub (ubuntu-latest) SUDAH punya Android SDK bawaan
      # (/usr/local/lib/android/sdk) — jangan pakai android-actions/setup-android,
      # karena action itu gagal: ia mencoba memasang paket "tools" yang sudah
      # tidak didistribusikan Google lagi (sdkmanager exit 1).
      # Bubblewrap memvalidasi SDK dengan memeriksa folder `tools/` atau `bin/`
      # di root SDK — SDK bawaan runner tidak punya keduanya, jadi buat symlink.
      - name: Pakai Android SDK bawaan runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          ls "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms" | head -20
          ls "$ANDROID_HOME/tools/bin" | head -5

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap paths
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Generate keystore (baru, sekali saja)
        id: keystore
        run: |
          PASS=$(openssl rand -hex 12)
          echo "password=$PASS" >> "$GITHUB_OUTPUT"
          echo "$PASS" > keystore-password.txt
          keytool -genkeypair -keystore android.keystore -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Ranszshop, OU=Lari Koin, O=Ranszshop, C=ID"
          keytool -list -v -keystore android.keystore -storepass "$PASS" | grep -i "SHA256" | head -1

      - name: Build APK + AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.password }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ steps.keystore.outputs.password }}
        run: |
          # gradlew kehilangan bit executable saat di-upload via web GitHub
          chmod +x gradlew
          bubblewrap build

      - name: Upload APK, AAB, keystore
        uses: actions/upload-artifact@v4
        with:
          name: lari-koin-apk
          path: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab
            twa/android.keystore
            twa/keystore-password.txt
          if-no-files-found: error
