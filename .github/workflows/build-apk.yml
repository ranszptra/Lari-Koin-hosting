name: Build APK (Nailong Runner)

# Build APK TWA gratis di GitHub (tanpa Play Store).
# Dijalankan manual dari tab Actions, atau otomatis saat file di twa/ berubah.
# Keystore penanda tangan disimpan sebagai GitHub Secrets repo
# (ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD) — JANGAN pernah
# menaruh keystore/password di artifact atau commit. Update APK HARUS
# ditandatangani keystore yang sama, kalau tidak pengguna lama tidak bisa update.

on:
  workflow_dispatch:
  push:
    paths:
      - 'twa/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Runner GitHub (ubuntu-latest) SUDAH punya Android SDK bawaan
      # (/usr/local/lib/android/sdk) — jangan pakai android-actions/setup-android,
      # karena action itu gagal: ia mencoba memasang paket "tools" yang sudah
      # tidak didistribusikan Google lagi (sdkmanager exit 1).
      # Bubblewrap memvalidasi SDK dengan memeriksa folder `tools/` atau `bin/`
      # di root SDK — SDK bawaan runner tidak punya keduanya, jadi buat symlink.
      - name: Pakai Android SDK bawaan runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          ls "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms" | head -20
          ls "$ANDROID_HOME/tools/bin" | head -5

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap paths
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      # Keystore diambil dari GitHub Secrets (bukan generate baru tiap run),
      # supaya update APK selalu ditandatangani kunci yang sama.
      - name: Pulihkan keystore dari Secrets
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android.keystore
          echo "password=$KEYSTORE_PASS" >> "$GITHUB_OUTPUT"
          keytool -list -v -keystore android.keystore -storepass "$KEYSTORE_PASS" | grep -i "SHA256" | head -1

      - name: Build APK + AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.password }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ steps.keystore.outputs.password }}
        run: |
          # gradlew kehilangan bit executable saat di-upload via web GitHub
          chmod +x gradlew
          bubblewrap build

      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: nailong-runner-apk
          path: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab
          if-no-files-found: error
