// Runner Coin — WebView wrapper + AdMob (tahap 2, v1.4.0).
// Proyek Android native (bukan TWA): WebView memuat game web yang sama
// (https://lari-koin-hosting-production.up.railway.app/) + Google Mobile
// Ads SDK + JS bridge ke app.js. Build di GitHub Actions
